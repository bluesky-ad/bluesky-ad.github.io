<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品全集 - 藍天廣告</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
    body { font-family: 'Noto Sans TC', sans-serif; }
    /* 瀑布流排版設定 */
    .waterfall-container {
        column-count: 2;
        column-gap: 1rem;
    }
    @media (min-width: 768px) { .waterfall-container { column-count: 3; } }
    @media (min-width: 1024px) { .waterfall-container { column-count: 4; } }
    
    .waterfall-item {
        break-inside: avoid;
        margin-bottom: 1rem;
        animation: fadeIn 0.6s ease-out forwards;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>
<body class="bg-gray-50 text-slate-800">

<nav class="bg-white/95 backdrop-blur-md shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <div class="bg-blue-600 text-white px-2 py-1 rounded font-black italic text-sm">藍天照相打字行</div>
            <span class="text-lg font-black text-slate-800 tracking-tight hidden md:block">廣告設計</span>
        </div>
        <div class="font-bold">
            <a href="index.html" class="text-blue-600 hover:text-blue-800 transition border-b-2 border-blue-600 pb-1">回首頁</a>
        </div>
    </div>
</nav>

<header class="bg-white border-b py-6">
    <div class="max-w-7xl mx-auto px-4">
        <div class="flex flex-col lg:flex-row justify-between items-center gap-4">
            <div class="text-center lg:text-left">
                <h1 class="text-xl font-black text-slate-900 italic">實品範例展示</h1>
                <p class="text-xs text-slate-400 mt-1">作品持續更新中</p>
            </div>
            
            <div class="w-full lg:w-auto bg-slate-50 px-6 py-3 rounded-2xl border border-slate-100 text-sm">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-10 gap-y-1 font-bold text-slate-600">
                    <p>📍 地址：花蓮市明心街6-5號</p>
                    <p>📞 電話：03-8357789</p>
                    <div class="flex items-center">
                        <span class="mr-1">💬 LINE：0920612429</span>
                        <a href="https://line.me/ti/p/~0920612429" class="ml-2 bg-green-500 text-white px-2 py-0.5 rounded text-[10px] hover:bg-green-600 transition">點我加入</a>
                    </div>
                    <p>⏰ 時間：周一至五 08:00-17:30</p>
                </div>
            </div>
        </div>
    </div>
</header>

<section class="py-8 min-h-screen">
    <div class="max-w-7xl mx-auto px-4">
        <div id="image-grid" class="waterfall-container"></div>

        <div id="loading-status" class="text-center py-12">
            <p id="status-text" class="text-slate-400 text-sm mt-4 font-medium italic">—— 已顯示所有 229 張作品 ——</p>
        </div>
    </div>
</section>

<footer class="py-10 text-center text-slate-400 text-xs border-t bg-white">
    <p>© 2026 藍天照相打字行 | 花蓮在地 40 年專業保證</p>
</footer>

<script>
    const grid = document.getElementById('image-grid');
    const totalImages = 229; // 修改：設定為目前的總張數 229
    const prefix = 'pp'; 
    const ext = '.webp'; 

    function loadGallery() {
        // 直接循環產出 229 張圖片，不進行網路偵測以加速載入
        for (let i = 1; i <= totalImages; i++) {
            const paddedIndex = i.toString().padStart(3, '0');
            const fileName = `${prefix}${paddedIndex}${ext}`;
            
            const item = document.createElement('div');
            item.className = 'waterfall-item';
            item.innerHTML = `
                <img src="${fileName}" 
                     loading="lazy" 
                     class="w-full rounded-2xl shadow-sm border border-white hover:shadow-lg transition-all duration-300" 
                     alt="作品${i}"
                     onerror="this.parentElement.style.display='none'">`;
            grid.appendChild(item);
        }
    }

    // 頁面結構準備好後立即執行
    document.addEventListener('DOMContentLoaded', loadGallery);
</script>

</body>
</html>
