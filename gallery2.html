<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品全集 - 藍天廣告</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
    body { font-family: 'Noto Sans TC', sans-serif; }
    /* 瀑布流排版設定 */
    .waterfall-container {
        column-count: 2;
        column-gap: 1rem;
    }
    @media (min-width: 768px) { .waterfall-container { column-count: 3; } }
    @media (min-width: 1024px) { .waterfall-container { column-count: 4; } }
    
    .waterfall-item {
        break-inside: avoid;
        margin-bottom: 1rem;
        animation: fadeIn 0.6s ease-out forwards;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>
<body class="bg-gray-50 text-slate-800">

<nav class="bg-white/95 backdrop-blur-md shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <div class="bg-blue-600 text-white px-2 py-1 rounded font-black italic text-sm">藍天照相打字行</div>
            <span class="text-lg font-black text-slate-800 tracking-tight hidden md:block">廣告設計</span>
        </div>
        <div class="font-bold">
            <a href="index.html" class="text-blue-600 hover:text-blue-800 transition border-b-2 border-blue-600 pb-1">回首頁</a>
        </div>
    </div>
</nav>

<header class="bg-white border-b py-6">
    <div class="max-w-7xl mx-auto px-4">
        <div class="flex flex-col lg:flex-row justify-between items-center gap-4">
            <div class="text-center lg:text-left">
                <h1 class="text-xl font-black text-slate-900 italic">實品範例展示</h1>
                <p class="text-xs text-slate-400 mt-1">作品持續更新中</p>
            </div>
            
            <div class="w-full lg:w-auto bg-slate-50 px-6 py-3 rounded-2xl border border-slate-100 text-sm">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-10 gap-y-1 font-bold text-slate-600">
                    <p>📍 地址：花蓮市明心街6-5號</p>
                    <p>📞 電話：03-8357789</p>
                    <div class="flex items-center">
                        <span class="mr-1">💬 LINE：0920612429</span>
                        <a href="https://line.me/ti/p/~0920612429" class="ml-2 bg-green-500 text-white px-2 py-0.5 rounded text-[10px] hover:bg-green-600 transition">點我加入</a>
                    </div>
                    <p>⏰ 時間：周一至五 08:00-17:30</p>
                </div>
            </div>
        </div>
    </div>
</header>

<section class="py-8 min-h-screen">
    <div class="max-w-7xl mx-auto px-4">
        <div id="image-grid" class="waterfall-container"></div>

        <div id="loading-status" class="text-center py-12">
            <div id="loader" class="inline-block w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
            <p id="status-text" class="text-slate-400 text-sm mt-4 font-medium">正在載入作品集...</p>
        </div>
    </div>
</section>

<footer class="py-10 text-center text-slate-400 text-xs border-t bg-white">
    <p>© 2026 藍天照相打字行 | 花蓮在地 40 年專業保證</p>
</footer>

<script>
    const grid = document.getElementById('image-grid');
    const statusText = document.getElementById('status-text');
    const loader = document.getElementById('loader');
    
    const prefix = 'pp'; // 照片前綴
    const ext = '.webp'; // 照片副檔名
    let currentIndex = 1;
    const batchSize = 5; // 每次同時偵測 5 張

    function checkAndLoadBatch() {
        let batchPromises = [];

        for (let i = 0; i < batchSize; i++) {
            const index = currentIndex + i;
            // 修正點：自動補零成三位數 (如 1 變成 001)
            const paddedIndex = index.toString().padStart(3, '0');
            const fileName = `${prefix}${paddedIndex}${ext}`;
            batchPromises.push(checkFileExists(fileName, index));
        }

        Promise.all(batchPromises).then(results => {
            const successfulImages = results.filter(r => r.exists).sort((a, b) => a.id - b.id);
            
            if (successfulImages.length > 0) {
                successfulImages.forEach(imgData => {
                    const item = document.createElement('div');
                    item.className = 'waterfall-item';
                    item.innerHTML = `<img src="${imgData.src}" loading="lazy" class="w-full rounded-2xl shadow-sm border border-white hover:shadow-lg transition-all duration-300" alt="作品${imgData.id}">`;
                    grid.appendChild(item);
                });

                if (successfulImages.length === batchSize) {
                    currentIndex += batchSize;
                    setTimeout(checkAndLoadBatch, 50); 
                } else {
                    finishLoading(currentIndex + successfulImages.length - 1);
                }
            } else {
                finishLoading(currentIndex - 1);
            }
        });
    }

    function checkFileExists(src, id) {
        return new Promise(resolve => {
            const img = new Image();
            img.onload = () => resolve({ exists: true, src: src, id: id });
            img.onerror = () => resolve({ exists: false, id: id });
            img.src = src;
        });
    }

    function finishLoading(total) {
        loader.classList.add('hidden');
        statusText.innerHTML = total > 0 ? `已顯示所有作品（共 ${total} 張）` : "目前尚無作品照片";
    }

    window.onload = checkAndLoadBatch;
</script>

</body>
</html>
